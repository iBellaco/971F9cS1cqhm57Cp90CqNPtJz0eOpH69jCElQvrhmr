Z7o0fxnPL/c601fff1054ce71f587718bba91638d3/aa_0_hanu.mp4"}},{"index":1,"title":"LA ESPADA DE LOS OSCUROS","description":"Golpea con su espada e inflige daño físico. Esta habilidad se puede activar 2 veces más, cada una de las cuales inflige más de daño. Lanza los aires a los enemigos a los que asesta golpes perfectos y les inflige daño adicional.","video":{"url":"https://videos.ctfassets.net/ekkp7rrkr2gn/78ECo4o6gyrm0iPmZBrdnK/0c6015dc60e567442e6d9dfd04236b6c/aa_1_hanu.mp4"}},{"index":2,"title":"CADENAS INFERNALES","description":"Lanza una cadena que inflige daño físico al primer enemigo golpeado y lo ralentiza. Si un campeón o monstruo grande permanece en el área de impacto, lo arrastra hacia el centro del área y le vuelve a infligir la misma cantidad de daño.","video":{"url":"https://videos.ctfassets.net/ekkp7rrkr2gn/xy7OyGGG7L6kzzOwj2gnO/8fde6effbe797ef9377a2009c57050a9/aa_2_hanu.mp4"}},{"index":3,"title":"DESLIZAMIENTO SOMBRÍO","description":"Pasiva : Aatrox obtiene succión física contra campeones enemigos, que aumenta durante El Aniquilador de mundos. Activa : Se desliza hacia delante. Esto reinicia el ataque básico de Aatrox. Se puede utilizar mientras se lanzan otras habilidades.","video":{"url":"https://videos.ctfassets.net/ekkp7rrkr2gn/ejl0ZhvqIGwLBtbp2Vc7H/a5bb371e07238c4fb088a013d14b17dc/aa_3_hanu.mp4"}},{"index":4,"title":"EL ANIQUILADOR DE MUNDOS","description":"Libera su forma demoniaca, lo que le otorga daño de ataque, curación adicional y velocidad de movimiento que disminuye con el tiempo. La duración de El Aniquilador de mundos aumenta con cada asesinato o asesinato. Aterroriza a los súbditos y monstruos cercanos al activarse.","video":{"url":"https://videos.ctfassets.net/ekkp7rrkr2gn/1Bi43MHnCtlkvzRbHwXbGD/d7c9440d4cede9b6ec2b8ec82e8e5e32/aa_4_hanu.mp4"}}],"roles":["jungle","top"],"guideVideoId":null,"earlyStrength":"Strong","midStrength":"Strong","lateStrength":"Normal","difficulty":"hard","damage":"High","resistance":"Medium","utility":"Low","pr
