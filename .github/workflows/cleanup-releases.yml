name: Prune Old GitHub Releases

on:
  workflow_dispatch:
  schedule:
    # Se ejecuta todos los domingos a la medianoche (opcional, para mantenimiento)
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  cleanup-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep only the latest release and delete older releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 🧹 INICIANDO LIMPIEZA DE RELEASES EN GITHUB ==="
          
          # Listar todos los releases disponibles
          RELEASES=$(gh release list --limit 1000)
          
          if [ -z "$RELEASES" ]; then
            echo "No se encontraron releases en el repositorio."
            exit 0
          fi
          
          echo "Releases actuales en el repositorio:"
          echo "$RELEASES"
          echo "----------------------------------------"
          
          # gh release list devuelve los releases ordenados del más nuevo al más antiguo.
          # Usamos awk 'NR>1 {print $3}' para omitir la fila 1 (el más reciente) y obtener los tags de los anteriores.
          OLD_TAGS=$(echo "$RELEASES" | awk 'NR>1 {print $3}')
          
          if [ -z "$OLD_TAGS" ]; then
            echo "✅ Solo existe 1 release (el más reciente). No hay nada que eliminar."
            exit 0
          fi
          
          echo "Se conservará el release más reciente:"
          echo "$RELEASES" | head -n 1
          echo "----------------------------------------"
          echo "Eliminando los releases antiguos y sus tags asociados..."
          
          echo "$OLD_TAGS" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "🗑️ Eliminando release: $tag"
              gh release delete "$tag" --cleanup-tag -y || echo "⚠️ Advertencia al eliminar $tag"
            fi
          done
          
          echo "=== ✅ LIMPIEZA FINALIZADA: Solo queda 1 release (el más reciente) ==="
