name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version: $JAVA_RAW_VERSION"
          if [ -z "$JAVA_RAW_VERSION" ]; then
            echo "ERROR: Unable to detect Java version from 'java -version' output."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 17 ] 2>/dev/null; then
            echo "ERROR: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully: version $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent debug keystore
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug keystore from base64 to ensure consistent signatures across updates..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Using existing keystore."
          else
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Wild Rift Drafting,O=AI Studio,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          echo "Keystore verified at ./debug.keystore"

      - name: Build Debug APK
        run: |
          export _JAVA_OPTIONS="-Djava.awt.headless=true"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            if [ ! -s "$EXPECTED_APK" ]; then
              echo "ERROR: APK exists but is empty: $EXPECTED_APK"
              exit 1
            fi
            echo "Confirmed valid debug APK at: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" -ls
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$ASSET_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F/ '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ -f "$ASSET_PATH" ] && [ -s "$ASSET_PATH" ]; then
            echo "Prepared release asset: $ASSET_PATH"
            echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
            echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built via **GitHub Actions**.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Workflow Run Attempt:** #${{ github.run_attempt }}
          - **Source Commit SHA:** \`${{ github.sha }}\`
          - **Branch / Ref:** \`${{ github.ref_name }}\`

          ---
          > ⚠️ **Notice:** This APK is intended for testing purposes only. It is not a production release for Google Play Store and is signed with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release: $TAG_NAME with asset: $ASSET_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "Release creation command completed successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "### 🚀 Debug APK Release Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Name:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to download:** Download the \`.apk\` directly from the **Assets** section of the release on your Android phone." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            echo "=== APK Build & Artifact Status ==="
            echo "The APK was successfully built and preserved as an Actions artifact."
            echo "Artifact name: app-debug-apk"

            echo "### ⚠️ Debug APK Build Succeeded (Release Publication Incomplete)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Android APK was compiled successfully, and the GitHub Actions artifact is available:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Name:** \`app-debug-apk\` (downloadable from the summary page of this workflow run)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note:** GitHub Release publication could not be completed, but the compiled APK is safe and ready." >> "$GITHUB_STEP_SUMMARY"
          fi
