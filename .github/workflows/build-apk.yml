name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Active Java Major Version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "ERROR: Could not detect Java version!"
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java version ($JAVA_MAJOR_VERSION) is less than 17!"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching for APKs inside app/build/outputs/apk/:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK at $APK_PATH is empty!"
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension!"; exit 1 ;;
          esac

          echo "Verified debug APK at: $APK_PATH (Size: $(stat -c%s "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="app"
          fi
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi

          ASSET_NAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH does not exist or is empty. Aborting release creation."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Asset does not have .apk extension!"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Debug APK Build #${{ github.run_number }}
          - **Tipo**: APK de depuración generado automáticamente.
          - **Compilado con**: GitHub Actions
          - **Número de ejecución**: \`${{ github.run_number }}\`
          - **Intento de ejecución**: \`${{ github.run_attempt }}\`
          - **Commit de origen**: \`${{ github.sha }}\`
          
          > ⚠️ **Aviso de Prueba**: Este APK está destinado exclusivamente para pruebas y evaluación interna. No es un lanzamiento de producción para Google Play Store y está firmado únicamente con un keystore temporal de depuración.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          REPO="${{ github.repository }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset: $ASSET_NAME"
            
            echo "### ✅ Debug APK Compilado y Publicado Exitosamente" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Lanzamiento (Release)**: [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Archivo APK**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📲 **Descarga directa**: Puedes descargar el archivo APK directamente desde la sección **Assets** de la [página de lanzamiento]($RELEASE_URL) e instalarlo en tu dispositivo móvil." >> "$GITHUB_STEP_SUMMARY"
            echo "- 📦 **Artefacto de respaldo**: El artefacto estándar de GitHub Actions (\`app-debug-apk\`) también está disponible en la sección de artefactos de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::La publicación en GitHub Releases no pudo completarse, pero la compilación del APK y el artefacto de Actions fueron exitosos."
            echo "=== Resumen de Compilación ==="
            echo "Compilación del APK: EXITOSA"
            echo "Artefacto de Actions: app-debug-apk (Disponible)"
            
            echo "### ⚠️ Compilación Exitosa del APK (Publicación en Release Omitida o con Advertencia)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Compilación**: El APK de depuración se compiló correctamente." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Descarga**: El artefacto de Actions **\`app-debug-apk\`** está disponible para su descarga en la sección de artefactos de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Nota de Release**: La creación automática del GitHub Release no pudo completarse (verifica los permisos de GitHub Actions o la configuración de token si se requiere Release público)." >> "$GITHUB_STEP_SUMMARY"
          fi
