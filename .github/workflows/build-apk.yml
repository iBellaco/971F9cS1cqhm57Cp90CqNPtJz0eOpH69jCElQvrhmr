name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare environment files
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              echo "GEMINI_API_KEY=" > .env
              echo "Created fallback .env"
            fi
          fi
          cp .env app/.env 2>/dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Restore persistent debug keystore
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Wild Rift Drafting,O=AI Studio,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore 2>/dev/null || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Confirmed valid debug APK at: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            find app/build/outputs/ -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$ASSET_DIR"
          ASSET_NAME="Wild-Rift-Coach-v1.77-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.77-build-${{ github.run_number }}
          name: Wild Rift Coach Debug APK #${{ github.run_number }}
          body: |
            ### 🎮 Wild Rift Coach - APK de Pruebas (Debug)
            - **Versión de la app:** v1.77
            - **Build:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            
            Descarga el archivo APK directamente en tu teléfono Android desde los archivos adjuntos (Assets) abajo.
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
